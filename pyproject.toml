[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgrai-a2a"
version = "0.1.0"
description = "BRIDGRAI A2A Platform — Agent-to-Agent cu Notar de Sens trust layer"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Mihai Rosca", email = "mihairosca1982@gmail.com"}]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
bridgrai-a2a = "launcher:main"
